{% extends "base.html" %}{% block content %}<div class="form-card"><h2>Create account</h2><form method="post">
<label class="form-label">Full name</label><input class="form-control mb-3" name="name" required>
<label class="form-label">Email</label><input class="form-control mb-3" name="email" type="email" required>
<label class="form-label">Password (at least 8 characters)</label><input class="form-control mb-3" name="password" type="password" minlength="8" required>
<button class="btn btn-primary">Register</button></form></div>{% endblock %}
