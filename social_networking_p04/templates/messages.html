{% extends "base.html" %}{% block content %}<h1>Messages</h1><p>Select a friend to start a conversation.</p><div class="cards">{% for f in friends %}<article class="panel"><h2>{{f.name}}</h2><a href="{{url_for('conversation',user_id=f.id)}}">Open conversation →</a></article>{% else %}<p class="muted">You need accepted friends before you can message someone.</p>{% endfor %}</div>{% endblock %}
