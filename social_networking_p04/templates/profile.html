{% extends "base.html" %}{% block content %}<h1>My profile</h1><form method="post" class="panel form-grid"><label>Full name<input name="name" required value="{{user.name}}"></label><label>Email (cannot be changed here)<input disabled value="{{user.email}}"></label><label>Date of birth<input type="date" name="dob" value="{{user.dob}}"></label><label>Phone<input name="phone" value="{{user.phone}}"></label><label>Address<input name="address" value="{{user.address}}"></label><label>Education<input name="education" value="{{user.education}}"></label><label class="wide">Photo URL<input type="url" name="photo_url" value="{{user.photo_url}}" placeholder="https://..."></label><label class="wide">Professional information<textarea name="professional_info">{{user.professional_info}}</textarea></label><label class="wide">Hobbies<input name="hobbies" value="{{user.hobbies}}"></label><div class="wide"><button>Save profile</button></div></form>{% endblock %}
