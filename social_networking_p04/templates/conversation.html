{% extends "base.html" %}{% block content %}<h1>Conversation with {{other.name}}</h1><section class="panel chat">{% for m in messages %}<div class="bubble {{'mine' if m.sender_id==session.get('user_id') else ''}}"><b>{{m.sender_name}}</b><p>{{m.body}}</p><small>{{m.sent_at}}</small></div>{% else %}<p class="muted">No messages yet. Say hello!</p>{% endfor %}</section><form method="post" class="send"><input name="body" maxlength="2000" placeholder="Write a message..." required><button>Send</button></form>{% endblock %}
