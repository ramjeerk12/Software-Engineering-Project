{% extends "base.html" %}{% block content %}<div class="form-card"><h2>Create business account</h2><form method="post">
<label class="form-label">Business / Contact name</label><input class="form-control mb-3" name="name" required>
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password (minimum 6 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="6" required>
<button class="btn btn-primary">Register</button></form></div>{% endblock %}
